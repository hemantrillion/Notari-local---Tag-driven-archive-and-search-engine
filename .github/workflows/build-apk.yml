name: Build and Deploy Notari APK

on:
  push:
    branches:
      - main
    paths:
      - 'real-app-Notari-(local)/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 21 (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies & Build Frontend
        run: |
          cd "real-app-Notari-(local)"
          npm install
          npm run build

      - name: Install Capacitor & Sync Android Project
        run: |
          cd "real-app-Notari-(local)"
          npm install @capacitor/core @capacitor/android
          npm install -D @capacitor/cli
          npx cap sync android || true

      - name: Generate Gradle Wrapper If Missing
        run: |
          cd "real-app-Notari-(local)/android"
          if [ ! -f "gradlew" ]; then
            gradle wrapper --gradle-version 8.2.1
          fi

      - name: Inject Custom Native Java Share Bridge & Priority Intent Filters
        run: |
          cd "real-app-Notari-(local)"
          mkdir -p android/app/src/main/java/online/hekugo/notarilocal
          cat << 'EOF' > android/app/src/main/java/online/hekugo/notarilocal/MainActivity.java
          package online.hekugo.notarilocal;

          import android.content.Intent;
          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  handleSendIntent(getIntent());
              }

              @Override
              protected void onNewIntent(Intent intent) {
                  super.onNewIntent(intent);
                  setIntent(intent);
                  handleSendIntent(intent);
              }

              private void handleSendIntent(Intent intent) {
                  if (intent == null) return;
                  String action = intent.getAction();
                  String type = intent.getType();

                  if (Intent.ACTION_SEND.equals(action) && type != null) {
                      String sharedText = intent.getStringExtra(Intent.EXTRA_TEXT);
                      if (sharedText == null) {
                          sharedText = intent.getStringExtra(Intent.EXTRA_SUBJECT);
                      }
                      if (sharedText != null && !sharedText.trim().isEmpty()) {
                          final String cleanUrl = sharedText.trim();
                          if (this.bridge != null && this.bridge.getWebView() != null) {
                              this.bridge.getWebView().post(new Runnable() {
                                  @Override
                                  public void run() {
                                      bridge.getWebView().evaluateJavascript(
                                          "if(window.handleAndroidIncomingShare){ window.handleAndroidIncomingShare('" + cleanUrl.replace("'", "\\'").replace("\n", " ") + "'); }",
                                          null
                                      );
                                  }
                              });
                          }
                      }
                  }
              }
          }
          EOF

          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|locale|smallestScreenSize|screenLayout|uiMode"
                      android:name=".MainActivity"
                      android:label="@string/title_activity_main"
                      android:theme="@style/AppTheme.NoActionBarLaunch"
                      android:launchMode="singleTask"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                      <intent-filter android:priority="999">
                          <action android:name="android.intent.action.SEND" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <data android:mimeType="text/plain" />
                      </intent-filter>

                      <intent-filter android:priority="999">
                          <action android:name="android.intent.action.SEND" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <data android:mimeType="text/*" />
                      </intent-filter>

                      <intent-filter android:priority="999">
                          <action android:name="android.intent.action.SEND" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <data android:mimeType="*/*" />
                      </intent-filter>

                  </activity>

                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="${applicationId}.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths"></meta-data>
                  </provider>
              </application>

              <uses-permission android:name="android.permission.INTERNET" />
          </manifest>
          EOF

      - name: Fix Kotlin Duplicate Classes Conflict in Gradle
        run: |
          cd "real-app-Notari-(local)"
          echo "" >> android/build.gradle
          echo "allprojects {" >> android/build.gradle
          echo "    configurations.all {" >> android/build.gradle
          echo "        resolutionStrategy {" >> android/build.gradle
          echo "            dependencySubstitution {" >> android/build.gradle
          echo "                substitute module('org.jetbrains.kotlin:kotlin-stdlib-jdk7') using module('org.jetbrains.kotlin:kotlin-stdlib:1.8.22')" >> android/build.gradle
          echo "                substitute module('org.jetbrains.kotlin:kotlin-stdlib-jdk8') using module('org.jetbrains.kotlin:kotlin-stdlib:1.8.22')" >> android/build.gradle
          echo "            }" >> android/build.gradle
          echo "        }" >> android/build.gradle
          echo "    }" >> android/build.gradle
          echo "}" >> android/build.gradle

      - name: Enable AndroidX in Gradle Properties & Build APK
        run: |
          cd "real-app-Notari-(local)/android"
          echo "android.useAndroidX=true" > gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Notari-local-v1.0.0-apk
          path: real-app-Notari-(local)/android/app/build/outputs/apk/debug/app-debug.apk
